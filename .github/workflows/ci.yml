name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt -c requirements-lock.txt ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Website data matches the processed tables
        # Rewrites docs/data from data/processed and fails if anything differs from the committed files.
        run: |
          python -m sdg_india site
          git diff --exit-code -- docs/data
